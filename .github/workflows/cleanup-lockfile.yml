name: Reconcile cleanup lockfile

on:
  push:
    branches:
      - garitas-cleanup-foundation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reconcile package lock without upgrades
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/cleanup-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: reconcile cleanup lockfile"
          git push
