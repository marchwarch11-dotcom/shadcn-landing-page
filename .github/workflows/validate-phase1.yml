name: Validate Garitas Phase 1

on:
  push:
    branches:
      - garitas-cleanup-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/validate-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-phase1.yml
          git commit -m "chore: remove Phase 1 validation workflow"
          git push
